services:
  master:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    # docker-compose.yml 的 master 服务
    volumes:
      - ./config/master.cnf:/etc/mysql/conf.d/master.cnf:ro
  slave:
    image: mysql:8.4
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"